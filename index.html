<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>買 Bria 還是 SeaLand n7</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#132018;--muted:#5d6c66;--line:#d7e0db;--buy:#1b6b45;--sub:#1e4ea3}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header,main,footer{width:min(680px,100%);margin:0 auto}header{padding:22px 16px 4px}h1{font-size:1.32rem;margin:0 0 6px}.lead{color:var(--muted);margin:0}
main{padding:8px 14px 36px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
h2{font-size:.95rem;margin:14px 0 8px}h2:first-child{margin-top:0}label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px}
input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button.primary{width:100%;margin-top:14px;border:0;border-radius:999px;padding:13px;font:inherit;font-weight:700;color:#fff;background:#143326}
#out{display:none}#out.show{display:block}.banner{border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#143326;color:#fff}.banner.subwin{background:#1e4ea3}.banner b{display:block;font-size:1.25rem;margin-top:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.col{border-radius:12px;padding:12px;color:#fff}.col.buy{background:var(--buy)}.col.sub{background:var(--sub)}.col b{display:block;font-size:1.35rem}.col span{opacity:.86;font-size:.78rem}
.day{color:var(--muted);margin:10px 0 0;font-size:.92rem}details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}summary{cursor:pointer;color:#345;font-size:.92rem}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px}td{padding:7px 0;border-bottom:1px solid var(--line)}td.r{text-align:right;white-space:nowrap}
footer{padding:0 16px 24px;color:var(--muted);font-size:.76rem}
</style></head><body>
<header><h1>買 Bria，還是訂 SeaLand n7？</h1>
<p class="lead">先填每年開多少。其餘已用常見數字，按一次就出答案。</p></header>
<main><form class="card" onsubmit="return run(event)">
<h2>你怎麼開</h2>
<div class="row"><div><label>每年公里</label><input id="km" type="number" value="20000"></div><div><label>算幾年</label><input id="years" type="number" value="10" min="1" max="15"></div></div>
<details><summary>改車價、月租、電費等假設</summary>
<h2>買 Foxtron Bria</h2>
<div class="row"><div><label>車價</label><input id="price" type="number" value="899000"></div><div><label>年利率 %</label><input id="apr" type="number" step="0.1" value="3.5"></div></div>
<div class="row"><div><label>貸款月數</label><input id="nper" type="number" value="84"></div><div><label>第十年殘值</label><input id="residual" type="number" value="50000"></div></div>
<div class="row"><div><label>十年保險＋稅</label><input id="ins" type="number" value="291000"></div><div><label>十年保養＋胎</label><input id="maint" type="number" value="150000"></div></div>
<div class="row"><div><label>換電池年份</label><input id="batYear" type="number" value="8"></div><div><label>換電池費用</label><input id="batCost" type="number" value="120000"></div></div>
<h2>SeaLand n7 一年方案</h2>
<div class="row"><div><label>月租</label><input id="rent" type="number" value="15800"></div><div><label>每公里加收</label><input id="perkm" type="number" step="0.1" value="2.1"></div></div>
<h2>兩邊都要付</h2>
<div class="row"><div><label>一度電</label><input id="kwh" type="number" step="0.1" value="6"></div><div><label>幾公里／度</label><input id="kmkwh" type="number" step="0.1" value="5"></div></div>
<div class="row"><div><label>高速每年公里</label><input id="hwy" type="number" value="10000"></div><div><label>高速每公里</label><input id="toll" type="number" step="0.01" value="1.15"></div></div>
<div class="row"><div><label>每月停車</label><input id="park" type="number" value="2750"></div><div></div></div>
</details>
<button class="primary" type="submit">哪邊比較省？</button>
</form>
<section id="out" class="card">
<div id="banner" class="banner"></div>
<div class="cmp"><div class="col buy"><span>買 Bria</span><b id="buyNet">—</b></div><div class="col sub"><span>SeaLand n7 一年方案</span><b id="subNet">—</b></div></div>
<p class="day" id="day"></p>
<details><summary>看細項怎麼加總</summary><table id="tbl"></table></details>
<details><summary>如果中途不開了（車突然不好賣）</summary><p class="day" id="exit"></p></details>
</section></main>
<footer>試算不是購車建議。n7 以一年方案、同條件續滿所算年數。</footer>
<script>
const $=id=>document.getElementById(id);
const nn=id=>{const v=parseFloat($(id).value);return Number.isFinite(v)?v:0};
function wan(v){const n=Math.round(v),abs=Math.abs(n);if(abs>=10000){const w=n/10000;const s=Math.abs(w)>=100?w.toFixed(0):w.toFixed(1).replace(/\.0$/,'');return (n<0?'\u2212':'')+s+' 萬';}return n.toLocaleString('zh-TW')+' 元';}
function pmt(P,apr,months){if(months<=0)return 0;const r=(apr/100)/12;if(!r)return P/months;return P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1)}
function remain(P,apr,months,paid){if(paid>=months)return 0;const r=(apr/100)/12;if(!r)return P*(1-paid/months);return P*(Math.pow(1+r,months)-Math.pow(1+r,paid))/(Math.pow(1+r,months)-1)}
function run(e){e.preventDefault();
const years=Math.max(1,nn('years')),kmY=nn('km'),loanM=Math.round(nn('nper'));
const monthly=pmt(nn('price'),nn('apr'),loanM);
const loanTotal=monthly*Math.min(years*12,loanM);
const ins=nn('ins')*(years/10),maint=nn('maint')*(years/10);
const bat=nn('batYear')<=years?nn('batCost'):0;
const residual=years>=10?nn('residual'):Math.round(nn('residual')*(years/10));
const kwhY=nn('kmkwh')>0?kmY/nn('kmkwh'):0;
const elec=kwhY*nn('kwh')*years,toll=nn('hwy')*nn('toll')*years,park=nn('park')*12*years,shared=elec+toll+park;
const buyCash=loanTotal+ins+maint+bat+shared,buyNet=buyCash-residual;
const rentY=nn('rent')*12*years,kmFee=nn('perkm')*kmY*years,subNet=rentY+kmFee+shared;
const diff=subNet-buyNet;
$('buyNet').textContent=wan(buyNet);$('subNet').textContent=wan(subNet);
const banner=$('banner');
if(diff>0){banner.className='banner';banner.innerHTML='這段期間買 Bria 比較省<b>少花約 '+wan(diff)+'</b>';}
else{banner.className='banner subwin';banner.innerHTML='這段期間 SeaLand n7 比較省<b>少花約 '+wan(-diff)+'</b>';}
$('day').textContent='買車平均一天約 '+Math.round(buyNet/(years*365)).toLocaleString('zh-TW')+' 元，含電費、過路費、停車。每年 '+kmY.toLocaleString('zh-TW')+' 公里 \u00d7 '+years+' 年。';
const rows=[['車貸本息／n7 月租',loanTotal,rentY],['n7 里程費',0,kmFee],['保險＋稅',ins,0],['保養＋胎',maint,0],['換電池',bat,0],['電費',elec,elec],['過路費',toll,toll],['停車',park,park],['現金總攤',buyCash,subNet],['減殘值',-residual,0],['淨成本',buyNet,subNet]];
$('tbl').innerHTML='<tr><td>項目</td><td class="r">買 Bria</td><td class="r">n7</td></tr>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td class="r">'+wan(r[1])+'</td><td class="r">'+wan(r[2])+'</td></tr>').join('');
const lines=[3,5,8].filter(y=>y<=years).map(y=>{const left=remain(nn('price'),nn('apr'),loanM,Math.min(y*12,loanM));const fire=y===3?400000:y===5?200000:0;const gap=Math.max(0,left-fire);const subPaid=nn('rent')*12*y+nn('perkm')*kmY*y;return y+' 年後若車只值 '+wan(fire)+'、還欠銀行 '+wan(left)+'：買車可能要再補 '+wan(gap)+'。n7 已付約 '+wan(subPaid)+'，退租不用補銀行。';});
$('exit').style.whiteSpace='pre-wrap';$('exit').textContent=lines.join('\n\n');
$('out').classList.add('show');$('out').scrollIntoView({behavior:'smooth'});return false;}
</script></body></html>
